<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create an account on Myth Rx to bookmark health investigations and track your submitted claims.">
  <title>Sign Up — Myth Rx | Busting Health Hoaxes</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Supabase Official JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--space-xl) var(--space-md);
      background: linear-gradient(180deg, #FFFFFF 0%, var(--color-bg) 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl) var(--space-xl);
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: var(--space-lg);
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand-logo" style="margin-bottom: var(--space-md); justify-content: center;">
        <div class="brand-logo-icon">&#x211E;</div>
        <div class="brand-logo-text" style="text-align: left;">
          <span class="brand-logo-title">Myth <span>Rx</span></span>
          <span class="brand-logo-tagline">Busting Health Hoaxes</span>
        </div>
      </a>
      <h1 style="font-size: 1.5rem; margin-bottom: 4px;">Create an Account</h1>
      <p class="text-muted" style="font-size: 0.9rem;">Join the community fighting viral health misinformation</p>
    </div>

    <!-- Frontend Preview Notice Box -->
    <div id="authPreviewNotice" class="medical-disclaimer-box" style="margin-top: 0; margin-bottom: var(--space-lg); font-size: 0.8rem; background-color: #EFF6FF; border-left-color: #3B82F6; color: #1E40AF;">
      <strong>Frontend Preview:</strong> Add your Supabase project credentials in <code>js/supabase.js</code> to enable live registration.
    </div>

    <!-- Registration Form -->
    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="signupFullName" class="form-label form-label-required">Full Name</label>
        <input 
          type="text" 
          id="signupFullName" 
          name="fullName" 
          class="form-control" 
          placeholder="Dr. / Alex Taylor"
          required
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="signupEmail" class="form-label form-label-required">Email Address</label>
        <input 
          type="email" 
          id="signupEmail" 
          name="email" 
          class="form-control" 
          placeholder="name@example.com"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="signupPassword" class="form-label form-label-required">Password</label>
        <input 
          type="password" 
          id="signupPassword" 
          name="password" 
          class="form-control" 
          placeholder="Minimum 8 characters"
          required
          minlength="8"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="signupConfirmPassword" class="form-label form-label-required">Confirm Password</label>
        <input 
          type="password" 
          id="signupConfirmPassword" 
          name="confirmPassword" 
          class="form-control" 
          placeholder="Re-enter password"
          required
          autocomplete="new-password"
        >
      </div>

      <div class="form-group" style="display: flex; align-items: flex-start; gap: 8px;">
        <input type="checkbox" id="termsCheck" required style="margin-top: 4px;">
        <label for="termsCheck" style="font-size: 0.82rem; color: var(--color-text-muted);">
          I agree to the <a href="about.html#editorial-standards">Editorial Terms</a> and acknowledge the <a href="about.html#disclaimer">Medical Disclaimer</a>.
        </label>
      </div>

      <div class="form-group mt-lg">
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="signupBtn">
          Create Free Account
        </button>
      </div>

      <div id="signupAlert" style="display: none; margin-top: var(--space-sm);"></div>
    </form>

    <div style="text-align: center; margin-top: var(--space-lg); padding-top: var(--space-md); border-top: 1px solid var(--color-border); font-size: 0.9rem;">
      <span class="text-muted">Already have an account?</span>
      <a href="login.html" style="font-weight: 700; margin-left: 4px;">Sign in</a>
    </div>

    <div style="text-align: center; margin-top: var(--space-md);">
      <a href="index.html" style="font-size: 0.85rem; color: var(--color-text-muted);">&larr; Return to homepage</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Hide preview notice if Supabase is configured
    document.addEventListener('DOMContentLoaded', () => {
      const notice = document.getElementById('authPreviewNotice');
      if (notice && window.MythRx?.isSupabaseConfigured?.()) {
        notice.style.display = 'none';
      }
    });
  </script>
</body>
</html>
